<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Defence Challenge | Хакатон 2026</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap">
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
/* ================= БАЗА ================= */
*,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg-0: #07090d;
    --bg-1: #0d1117;
    --bg-2: #161b22;
    --bg-3: #1c2330;

    --accent: #f78166;
    --accent-2: #ff9c85;
    --accent-dark: #e56b50;

    --blue: #58a6ff;
    --green: #7ee787;
    --purple: #b392ff;
    --yellow: #ffd33d;

    --text: #f0f6fc;
    --muted: #8b949e;
    --line: rgba(255, 255, 255, 0.08);

    --glow: 0 0 24px rgba(247, 129, 102, 0.45);
    --glow-strong: 0 0 40px rgba(247, 129, 102, 0.65);

    --card-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    --transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Exo 2', sans-serif;
    background: var(--bg-0);
    color: var(--text);
    overflow-x: hidden;
    min-height: 100vh;
    line-height: 1.5;
}

#particles-js {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(1200px 700px at 15% 0%, rgba(247, 129, 102, 0.10), transparent 60%),
        radial-gradient(900px 600px at 85% 20%, rgba(88, 166, 255, 0.10), transparent 60%),
        radial-gradient(900px 700px at 50% 100%, rgba(179, 146, 255, 0.08), transparent 60%),
        linear-gradient(180deg, #07090d 0%, #0d1117 60%, #07090d 100%);
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px;
}

/* ================= ПРЕЛОАДЕР ================= */
.preloader {
    position: fixed;
    inset: 0;
    background: var(--bg-0);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.6s ease, visibility 0.6s ease;
}
.preloader.hide {
    opacity: 0;
    visibility: hidden;
}
.preloader-content { text-align: center; }
.tower {
    width: 60px;
    height: 100px;
    margin: 0 auto 28px;
    position: relative;
    background: linear-gradient(to bottom, var(--accent), var(--accent-dark));
    clip-path: polygon(0% 100%, 25% 0%, 75% 0%, 100% 100%);
    animation: tower-pulse 2s infinite;
}
.tower::before {
    content: '';
    position: absolute;
    top: 10px;
    left: 20px;
    width: 20px;
    height: 20px;
    background: var(--yellow);
    border-radius: 50%;
    box-shadow: 0 0 18px var(--yellow);
}
.loader-text {
    font-size: 1.1rem;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: text-pulse 1.6s infinite;
}

/* ================= ХЕДЕР ================= */
.header {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 60px 0 40px;
    position: relative;
    isolation: isolate;
}

.header-content {
    z-index: 2;
    will-change: transform;
}

.logo-container {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 0 auto 32px;
}
.logo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 3;
    filter: drop-shadow(0 0 24px rgba(247, 129, 102, 0.45));
    animation: logo-float 6s ease-in-out infinite;
}
.logo-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 240px;
    height: 240px;
    background: radial-gradient(circle, rgba(247, 129, 102, 0.22) 0%, transparent 70%);
    z-index: 1;
    animation: glow-pulse 3s infinite;
}
.logo-pulse {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 280px;
    height: 280px;
    border: 2px solid rgba(247, 129, 102, 0.25);
    border-radius: 50%;
    z-index: 2;
    animation: pulse 2.4s infinite;
}

.main-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 6vw, 4.2rem);
    font-weight: 900;
    margin-bottom: 18px;
    text-transform: uppercase;
    letter-spacing: 3px;
    line-height: 1.05;
}
.title-word {
    display: block;
    opacity: 0;
    transform: translateY(30px);
    animation: title-reveal 0.9s forwards;
}
.title-word-1 { color: var(--accent); animation-delay: 0.15s; }
.title-word-2 { color: var(--blue); animation-delay: 0.35s; }
.title-word-3 { color: var(--green); animation-delay: 0.55s; }

.subtitle {
    font-size: clamp(1rem, 2.2vw, 1.4rem);
    color: var(--muted);
    margin-bottom: 40px;
    font-weight: 300;
}

.header-stats {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 50px;
    margin-top: 20px;
}
.stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}
.stat i {
    font-size: 2rem;
    color: var(--accent);
}
.stat-number {
    font-size: clamp(2rem, 4vw, 2.8rem);
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    color: var(--text);
}
.stat-label {
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

/* ТАЙМЕР */
.countdown {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 18px;
    margin: 36px 0 8px;
}
.countdown-item {
    min-width: 110px;
    padding: 16px 22px;
    border-radius: 16px;
    background: rgba(247, 129, 102, 0.08);
    border: 1px solid rgba(247, 129, 102, 0.28);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
.countdown-number {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.8rem, 3vw, 2.4rem);
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
}
.countdown-label {
    margin-top: 6px;
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.scroll-indicator {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    animation: bounce 2.2s infinite;
    cursor: pointer;
    color: var(--accent);
    font-size: 1.8rem;
    z-index: 3;
}

/* ================= СЕКЦИИ ================= */
section {
    padding: 110px 0;
    position: relative;
}

.section-header {
    text-align: center;
    margin-bottom: 60px;
}
.section-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 26px;
    margin-bottom: 16px;
}
.title-text {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.6rem, 3.5vw, 2.4rem);
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 2px;
}
.title-line {
    height: 2px;
    width: 90px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
.section-subtitle {
    font-size: 1.1rem;
    color: var(--muted);
}

/* ================= О ХАКАТОНЕ ================= */
.about-content {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 26px;
    margin-bottom: 80px;
}
.about-card {
    background: linear-gradient(180deg, rgba(22, 27, 34, 0.9), rgba(13, 17, 23, 0.9));
    border-radius: 20px;
    padding: 38px 30px;
    text-align: center;
    border: 1px solid var(--line);
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}
.about-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(247, 129, 102, 0.12), transparent 60%);
    opacity: 0;
    transition: var(--transition);
}
.about-card:hover {
    transform: translateY(-10px);
    border-color: rgba(247, 129, 102, 0.45);
    box-shadow: var(--glow-strong);
}
.about-card:hover::before { opacity: 1; }

.about-icon {
    width: 76px;
    height: 76px;
    margin: 0 auto 22px;
    background: rgba(247, 129, 102, 0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--accent);
    position: relative;
    z-index: 1;
}
.about-icon i {
    font-size: 2rem;
    color: var(--accent);
}
.about-card h3 {
    font-size: 1.35rem;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
}
.about-card p {
    color: var(--muted);
    position: relative;
    z-index: 1;
}

/* ================= ТАЙМЛАЙН ================= */
.timeline {
    position: relative;
    max-width: 820px;
    margin: 0 auto;
}
.timeline-line {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    height: 100%;
    background: linear-gradient(to bottom, var(--accent), transparent);
    opacity: 0.5;
}
.timeline-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 50px;
    position: relative;
    gap: 20px;
}
.timeline-item:nth-child(odd) { flex-direction: row-reverse; }

.timeline-date {
    flex: 1;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
    padding: 10px 16px;
    background: rgba(247, 129, 102, 0.08);
    border-radius: 12px;
    border: 1px solid rgba(247, 129, 102, 0.3);
}
.timeline-content {
    flex: 2;
    padding: 22px 24px;
    background: rgba(22, 27, 34, 0.8);
    border-radius: 16px;
    border: 1px solid var(--line);
    transition: var(--transition);
}
.timeline-content:hover {
    border-color: rgba(247, 129, 102, 0.45);
    box-shadow: var(--glow);
}
.timeline-content h4 {
    font-size: 1.15rem;
    margin-bottom: 8px;
}
.timeline-content p { color: var(--muted); }

.timeline-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 18px;
    height: 18px;
    background: var(--accent);
    border-radius: 50%;
    z-index: 2;
    box-shadow: 0 0 22px var(--accent);
}

/* ================= УЧАСТНИКИ ================= */
.participants-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 28px;
    margin-bottom: 60px;
}

.participant-card {
    height: 360px;
    perspective: 1200px;
    position: relative;
}
.card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    transform-style: preserve-3d;
}
.participant-card:hover .card-inner {
    transform: rotateY(180deg);
}

.card-front,
.card-back {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.card-front {
    background: linear-gradient(180deg, rgba(22, 27, 34, 0.95), rgba(13, 17, 23, 0.95));
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
    text-align: center;
}

.card-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(247, 129, 102, 0.12), transparent 70%);
    pointer-events: none;
}

.participant-avatar {
    position: relative;
    width: 110px;
    height: 110px;
    margin-bottom: 18px;
    z-index: 2;
}
.avatar-frame {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: linear-gradient(45deg, var(--accent), var(--blue), var(--green)) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    border: 3px solid transparent;
    animation: rotate 12s linear infinite;
}
.avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--bg-2);
    background: var(--bg-2);
}

.participant-name {
    font-size: 1.35rem;
    margin-bottom: 4px;
    z-index: 2;
}
.participant-role {
    color: var(--accent);
    font-size: 0.95rem;
    margin-bottom: 16px;
    z-index: 2;
}
.participant-skills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    z-index: 2;
}
.skill {
    padding: 5px 12px;
    background: rgba(88, 166, 255, 0.1);
    border-radius: 14px;
    font-size: 0.75rem;
    color: var(--blue);
    border: 1px solid rgba(88, 166, 255, 0.3);
}

.card-hover {
    position: absolute;
    bottom: 18px;
    right: 18px;
    width: 38px;
    height: 38px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(20px);
    transition: var(--transition);
    z-index: 2;
    color: #fff;
}
.participant-card:hover .card-hover {
    opacity: 1;
    transform: translateY(0);
}

.card-back {
    background: linear-gradient(135deg, var(--bg-2), var(--bg-1));
    transform: rotateY(180deg);
    padding: 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border: 1px solid rgba(247, 129, 102, 0.55);
    box-shadow: var(--glow);
}
.card-back h3 {
    font-size: 1.5rem;
    margin-bottom: 12px;
}
.card-back p {
    color: var(--muted);
    margin-bottom: 20px;
    font-size: 0.95rem;
}

.github-btn {
    padding: 10px 22px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: var(--transition);
    font-size: 0.9rem;
    position: relative;
    z-index: 5;
}
.github-btn:hover {
    background: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 12px 24px rgba(247, 129, 102, 0.35);
}

/* ================= МЕНТОР ================= */
.mentor-card {
    background: linear-gradient(135deg, rgba(179, 146, 255, 0.1), rgba(88, 166, 255, 0.1));
    border-radius: 22px;
    padding: 40px 30px;
    text-align: center;
    border: 1px solid rgba(179, 146, 255, 0.3);
    position: relative;
    overflow: hidden;
    grid-column: 1 / -1;
    max-width: 620px;
    margin: 0 auto;
}
.mentor-glow {
    position: absolute;
    inset: -50%;
    background: radial-gradient(circle, rgba(179, 146, 255, 0.12) 0%, transparent 70%);
    pointer-events: none;
}
.mentor-avatar {
    position: relative;
    width: 140px;
    height: 140px;
    margin: 0 auto 22px;
    z-index: 2;
}
.mentor-frame {
    border-width: 4px;
    background: linear-gradient(45deg, var(--purple), var(--blue)) border-box;
}
.mentor-name {
    font-size: 1.8rem;
    margin-bottom: 6px;
    position: relative;
    z-index: 2;
}
.mentor-role {
    color: var(--purple);
    font-size: 1.1rem;
    margin-bottom: 18px;
    position: relative;
    z-index: 2;
}
.mentor-bio {
    color: var(--muted);
    margin-bottom: 26px;
    max-width: 520px;
    margin-inline: auto;
    position: relative;
    z-index: 2;
}
.mentor-contact {
    display: flex;
    justify-content: center;
    gap: 18px;
    position: relative;
    z-index: 2;
}
.social-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(179, 146, 255, 0.15);
    border: 1px solid rgba(179, 146, 255, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--purple);
    font-size: 1.1rem;
    transition: var(--transition);
    text-decoration: none;
}
.social-btn:hover {
    background: var(--purple);
    color: #fff;
    transform: translateY(-5px);
    box-shadow: 0 12px 24px rgba(179, 146, 255, 0.35);
}

/* ================= РЕСУРСЫ ================= */
.actions-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 26px;
}
.action-btn {
    background: linear-gradient(180deg, rgba(22, 27, 34, 0.9), rgba(13, 17, 23, 0.9));
    border-radius: 20px;
    padding: 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    text-decoration: none;
    border: 1px solid var(--line);
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}
.action-btn:hover {
    transform: translateY(-10px);
    border-color: rgba(247, 129, 102, 0.45);
}
.project-btn:hover { box-shadow: 0 24px 48px rgba(88, 166, 255, 0.25); }
.academy-btn:hover { box-shadow: 0 24px 48px rgba(126, 231, 135, 0.25); }
.tasks-btn:hover { box-shadow: 0 24px 48px rgba(247, 129, 102, 0.25); }
.rules-btn:hover { box-shadow: 0 24px 48px rgba(179, 146, 255, 0.25); }

.btn-icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    flex-shrink: 0;
}
.project-btn .btn-icon { background: rgba(88, 166, 255, 0.15); color: var(--blue); }
.academy-btn .btn-icon { background: rgba(126, 231, 135, 0.15); color: var(--green); }
.tasks-btn .btn-icon { background: rgba(247, 129, 102, 0.15); color: var(--accent); }
.rules-btn .btn-icon { background: rgba(179, 146, 255, 0.15); color: var(--purple); }

.btn-content { flex: 1; }
.btn-content h3 {
    font-size: 1.25rem;
    margin-bottom: 6px;
}
.btn-content p {
    color: var(--muted);
    font-size: 0.9rem;
}
.btn-arrow {
    color: var(--muted);
    font-size: 1.3rem;
    transition: var(--transition);
}
.action-btn:hover .btn-arrow {
    color: var(--accent);
    transform: translateX(8px);
}

/* ================= ФУТЕР ================= */
.footer {
    background: rgba(7, 9, 13, 0.9);
    border-top: 1px solid var(--line);
    padding: 60px 0 30px;
    margin-top: 100px;
}
.footer-content {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 40px;
    margin-bottom: 36px;
}
.footer-logo { flex: 1; min-width: 200px; }
.footer-logo-img {
    width: 180px;
    height: auto;
    filter: drop-shadow(0 0 12px rgba(247, 129, 102, 0.3));
}
.footer-info { flex: 2; min-width: 280px; }
.footer-info h3 {
    font-size: 1.5rem;
    margin-bottom: 12px;
}
.footer-info p {
    color: var(--muted);
    margin-bottom: 18px;
}
.footer-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}
.tag {
    padding: 5px 14px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    font-size: 0.85rem;
    color: var(--muted);
    border: 1px solid rgba(255, 255, 255, 0.12);
}
.footer-social {
    flex: 1;
    min-width: 200px;
    display: flex;
    justify-content: flex-end;
    gap: 14px;
}
.social-icon {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    font-size: 1.1rem;
    transition: var(--transition);
    text-decoration: none;
}
.social-icon:hover {
    background: var(--accent);
    transform: translateY(-5px);
    box-shadow: 0 12px 24px rgba(247, 129, 102, 0.35);
}
.footer-bottom {
    text-align: center;
    padding-top: 26px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.85rem;
}
.footer-bottom p { margin-bottom: 8px; }
.pulse-heart {
    color: var(--accent);
    animation: heartbeat 1.6s infinite;
}

/* ================= АНИМАЦИИ ================= */
@keyframes tower-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}
@keyframes text-pulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
}
@keyframes logo-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-16px); }
}
@keyframes glow-pulse {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.85; transform: translate(-50%, -50%) scale(1.08); }
}
@keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
    70% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
}
@keyframes title-reveal {
    to { opacity: 1; transform: translateY(0); }
}
@keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
    40% { transform: translateX(-50%) translateY(-18px); }
    60% { transform: translateX(-50%) translateY(-9px); }
}
@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
.reveal.animate-in {
    opacity: 1;
    transform: translateY(0);
}

/* ================= АДАПТИВ ================= */
@media (max-width: 992px) {
    .participants-container { grid-template-columns: repeat(2, 1fr); }
    .header-stats { gap: 36px; }
}
@media (max-width: 768px) {
    section { padding: 80px 0; }
    .timeline-item,
    .timeline-item:nth-child(odd) {
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
    .timeline-line { left: 18px; }
    .timeline-dot { left: 18px; }
    .timeline-date { margin-bottom: 14px; }
    .participants-container { grid-template-columns: 1fr; }
    .footer-content { flex-direction: column; text-align: center; }
    .footer-social { justify-content: center; }
    .action-btn {
        flex-direction: column;
        text-align: center;
    }
    .btn-icon { margin-bottom: 14px; }
}
